[pytest]
addopts =
    --base-url=https://parabank.parasoft.com/parabank
    --browser=chromium
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
testpaths = tests
markers =
    smoke: high-value checks that verify the core application is usable
    regression: broader user journeys for banking features
